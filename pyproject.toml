[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labreach"
version = "0.1.0"
description = "Fully local, autonomous research-outreach agent (dry-run by default)"
requires-python = ">=3.11"
dependencies = [
  "httpx",
  "beautifulsoup4",
  "pydantic>=2",
  "typer",
  "rich",
  "keyring",
  "pypdf",
  "python-docx",
  "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "freezegun", "ruff"]
tools = ["reportlab"]   # only for tools/build_resume.py

[project.scripts]
labreach = "labreach.cli:app"

[tool.setuptools.packages.find]
include = ["labreach*"]

[tool.setuptools.package-data]
labreach = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]   # long user-facing strings
